<div class="container" *ngIf="recipe as r; else noData">
  <section class="inner-page-banner bg-common" style="background-image: url('assets/sample-product/product38.jpg');">
    <div class="container">
      <div class="breadcrumbs-area">
        <h1>{{ r.name }}</h1>
        <ul>
          <li><a routerLink="/">Home</a></li>
          <li>Recipe Detail</li>
        </ul>
      </div>
    </div>
  </section>

  <div class="row" style="margin-top: 24px;">
    <div class="col-12 col-md-8">
      <h2>{{ r.name }}</h2>
      <p>{{ r.description }}</p>

      <h3>Ingredients</h3>
      <ul>
        <li *ngFor="let ing of r.ingredients">{{ ing.ingredient }}</li>
      </ul>
      <p></p>
      <h3>Steps</h3>
      <ol>
        <li *ngFor="let s of r.steps">{{ s.stepDescription }}</li>
      </ol>
    </div>
    <div class="col-12 col-md-4">
      <div class="card">
        <div class="card-body">
          <div><strong>Preparation time:</strong> {{ r.preparationTime }} mins</div>
          <div><strong>Rating:</strong> {{ r.rating }} / 10</div>
        </div>
      </div>
      <button class="btn btn-primary" routerLink="/" style="margin-top: 16px;">Back to recipes</button>
    </div>
  </div>
</div>

<ng-template #noData>
  <div class="container" style="margin-top: 24px;">
    <p>No recipe data provided. Please navigate from the home page.</p>
    <button class="btn btn-primary" routerLink="/">Back to Home</button>
  </div>
</ng-template>
